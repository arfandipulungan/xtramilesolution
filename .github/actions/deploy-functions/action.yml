name: deploy-functions
description: Run-from-package deploy to the staging slot, swap, swap back on failure.
inputs:
  app_name:    { description: App name, required: true }
  environment: { description: dev | staging | prod, required: true }
  package:     { description: Path to the zip artifact, required: true }
runs:
  using: composite
  steps:
    - name: Resolve names
      shell: bash
      run: |
        echo "RG=rg-${{ inputs.app_name }}-${{ inputs.environment }}"     >> "$GITHUB_ENV"
        echo "FUNC=func-${{ inputs.app_name }}-${{ inputs.environment }}" >> "$GITHUB_ENV"

    - name: Deploy to staging slot
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.FUNC }}
        slot-name: staging
        package: ${{ inputs.package }}

    - name: Check staging slot is running
      shell: bash
      run: |
        state=$(az functionapp show -g "$RG" -n "$FUNC" --slot staging --query state -o tsv)
        [ "$state" = "Running" ] || { echo "::error::Staging slot state: $state"; exit 1; }

    - name: Swap staging -> production
      shell: bash
      run: az functionapp deployment slot swap -g "$RG" -n "$FUNC" --slot staging --target-slot production

    - name: Verify production (rollback = swap back)
      shell: bash
      run: |
        state=$(az functionapp show -g "$RG" -n "$FUNC" --query state -o tsv)
        if [ "$state" != "Running" ]; then
          echo "::error::Production not running - rolling back"
          az functionapp deployment slot swap -g "$RG" -n "$FUNC" --slot staging --target-slot production
          exit 1
        fi
