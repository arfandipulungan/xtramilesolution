name: security-gates
description: Secrets detection, SCA, SAST and IaC scanning. Any High/Critical finding fails the build.
inputs:
  scan_path:
    description: Application source folder (contains the .sln)
    required: true
  runtime:
    description: net8 | net48
    required: true
  iac_path:
    description: Optional Terraform folder
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install scanners (pinned versions)
      shell: bash
      run: |
        curl -sSLf https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          | tar -xz -C /tmp gitleaks
        curl -sSLf https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
          | tar -xz -C /tmp trivy

    - name: Secrets detection (Gitleaks, full git history)
      shell: bash
      run: /tmp/gitleaks git --redact --verbose .

    # SCA needs a resolved dependency graph. With RestorePackagesWithLockFile=true the restore
    # writes packages.lock.json (direct + transitive) for Trivy. .NET Framework apps use
    # packages.config, which Trivy reads directly, so no restore is needed for net48.
    - name: Setup .NET 8 (for dependency resolution)
      if: inputs.runtime == 'net8'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: "8.0.x"

    - name: Resolve dependencies (writes packages.lock.json)
      if: inputs.runtime == 'net8'
      shell: bash
      run: dotnet restore "${{ inputs.scan_path }}"

    - name: SCA - vulnerable NuGet dependencies (Trivy)
      shell: bash
      run: |
        lockfiles=$(find "${{ inputs.scan_path }}" -name packages.lock.json -o -name packages.config | wc -l)
        if [ "$lockfiles" -eq 0 ]; then
          echo "::error::No packages.lock.json or packages.config found - SCA would scan nothing"; exit 1
        fi
        /tmp/trivy fs "${{ inputs.scan_path }}" \
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

    - name: SAST (Semgrep, C# ruleset)
      shell: bash
      run: |
        docker run --rm -v "$PWD:/src" semgrep/semgrep:1.90.0 \
          semgrep scan --config p/csharp --error --metrics=off /src/${{ inputs.scan_path }}

    - name: IaC scan (Checkov)
      if: inputs.iac_path != ''
      shell: bash
      run: |
        docker run --rm -v "$PWD:/src" bridgecrew/checkov:3.2.255 \
          -d /src/${{ inputs.iac_path }} --framework terraform --compact
