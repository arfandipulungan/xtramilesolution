# Consumer: .NET 8 Web API on Azure App Service
name: customer-api

on:
  push:
    branches: [main]
    paths:
      - "apps/customer-api/**"
      - ".github/workflows/dotnet-build-deploy.yml"
      - ".github/workflows/deploy.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "apps/customer-api/**"
      - ".github/workflows/dotnet-build-deploy.yml"
      - ".github/workflows/deploy.yml"
      - ".github/actions/**"
  # Manual run (Actions -> Run workflow) is the only way to deploy
  workflow_dispatch:
    inputs:
      deploy_to:
        description: "Deploy after build & security gates"
        type: choice
        options: [none, dev, staging, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/dotnet-build-deploy.yml
    with:
      app_name: customer-api
      runtime: net8
      target: appservice
      cloud: azure
      solution_path: apps/customer-api
      publish_project: apps/customer-api/src/CustomerApi/CustomerApi.csproj
      # iac_path: infra/live/prod/azure/customer-api   # enable once Task 2 Terraform is in the repo
      # push / pull_request: build + security gates only (never deploys)
      deploy_to: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to || 'none' }}
