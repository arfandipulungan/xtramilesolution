# Consumer: AWS web/app tier on EC2 behind the ALB. Same template, different parameters.
name: legacy-web

on:
  push:
    branches: [main]
    paths:
      - "apps/legacy-web/**"
      - ".github/workflows/legacy-web.yml"
      - ".github/workflows/dotnet-build-deploy.yml"
      - ".github/workflows/deploy.yml"
      - ".github/actions/**"
  # No path filter on PRs: the three required status checks must report on EVERY PR,
  # otherwise PRs that only touch other files (docs, dependabot.yml) could never merge.
  pull_request:
  # Manual run (Actions -> Run workflow) is the only way to deploy
  workflow_dispatch:
    inputs:
      deploy_to:
        description: "Deploy after build & security gates"
        type: choice
        options: [none, dev, staging, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/dotnet-build-deploy.yml
    with:
      app_name: legacy-web
      runtime: net8
      target: ec2-alb
      cloud: aws
      solution_path: apps/legacy-web
      publish_project: apps/legacy-web/src/LegacyWeb/LegacyWeb.csproj
      # iac_path: infra/live/prod/aws/legacy-web   # enable once Task 2 Terraform is in the repo
      # push / pull_request: build + security gates only (never deploys)
      deploy_to: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to || 'none' }}
