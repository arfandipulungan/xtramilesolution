# Configuration management for the IIS VM (Azure) and EC2 (AWS) hosts.
# PR / push: lint + syntax check (no hosts needed). Real runs: --check --diff first,
# then apply, from a self-hosted runner inside the hub network.
name: ansible

on:
  pull_request:          # no path filter: "Ansible lint" is a required check on every PR
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        default: dev
      mode:
        description: "check = dry run with diff (no changes), apply = make changes"
        type: choice
        options: [check, apply]
        default: check
      limit:
        description: "Optional host/group limit, e.g. windows_iis"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  ANSIBLE_CORE_VERSION: "2.21.6"
  ANSIBLE_LINT_VERSION: "26.11.1"

jobs:
  lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned Ansible tooling and collections
        run: |
          pip install --quiet "ansible-core==${ANSIBLE_CORE_VERSION}" "ansible-lint==${ANSIBLE_LINT_VERSION}"
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Syntax check every playbook
        run: |
          for p in playbooks/*.yml; do
            ansible-playbook --syntax-check -i localhost, "$p"
          done

      - name: ansible-lint (production profile)
        run: ansible-lint

  configure:
    name: Configure hosts
    needs: lint
    # Needs real hosts: enable with repo variable ANSIBLE_HOSTS_ENABLED=true once the
    # self-hosted runner in the hub and the OIDC identities exist (Task 2 Terraform).
    if: vars.ANSIBLE_HOSTS_ENABLED == 'true' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, hub]
    environment: ${{ inputs.mode == 'apply' && format('infra-{0}', inputs.environment) || format('infra-{0}-plan', inputs.environment || 'dev') }}
    concurrency: ansible-${{ inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ansible
    env:
      ANSIBLE_SSM_BUCKET: ${{ vars.ANSIBLE_SSM_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC) for the azure_rm inventory and WinRM targets
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: AWS login (OIDC) for the aws_ec2 inventory and SSM sessions
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Install pinned Ansible and collections
        run: |
          python3 -m venv .venv && . .venv/bin/activate
          pip install --quiet "ansible-core==${ANSIBLE_CORE_VERSION}" pywinrm[kerberos] boto3 azure-identity
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Run site.yml
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          MODE: ${{ inputs.mode || 'check' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          . .venv/bin/activate
          args=(-i "inventories/${ENVIRONMENT}" playbooks/site.yml --diff)
          [ "$MODE" = "check" ] && args+=(--check)
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          ansible-playbook "${args[@]}"
