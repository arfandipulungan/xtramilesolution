---
# AWS Systems Manager Session Manager: no SSH, no inbound ports, every session audited.
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_region: ap-southeast-2
ansible_aws_ssm_bucket_name: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSM_BUCKET') }}"
ansible_aws_ssm_bucket_sse_mode: aws:kms
ansible_become: true
