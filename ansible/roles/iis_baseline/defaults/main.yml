---
iis_baseline_site_name: legacy-portal
iis_baseline_app_pool: "{{ iis_baseline_site_name }}"
iis_baseline_root: D:\sites\{{ iis_baseline_site_name }}
iis_baseline_log_dir: D:\logs\iis
# Certificate thumbprint in LocalMachine\My, placed by the Key Vault VM extension
iis_baseline_cert_thumbprint: ""
iis_baseline_features:
  - Web-Server
  - Web-Asp-Net45
  - Web-Net-Ext45
  - Web-ISAPI-Ext
  - Web-ISAPI-Filter
  - Web-Http-Logging
  - Web-Request-Monitor
  - Web-Filtering
  - Web-Mgmt-Console
